<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app"></div>
<button id="btn">count++</button>
<script type="module">
  import { h, createApp, ref } from '../dist/index.js'

  const Comp = {
    setup() {
      const count = ref(0)
      btn.onclick = () => { count.value++ }

      return {
        count
      }
    },
    render() {
      console.log(this)
      return h('div', this.count)
    }
  }


  createApp(Comp, { msg: 'hello' }).mount('#app')
</script>
</body>
</html>
