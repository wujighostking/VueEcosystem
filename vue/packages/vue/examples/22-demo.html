<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { h, createApp, onMounted, ref, KeepAlive, onUnmounted } from '../dist/index.js'

  const Comp1 = {
    setup() {
      onMounted(() => {
        console.log('Comp1 mounted')
      })
      onUnmounted(() => {
        console.log('Comp1 unmounted')
      })
      return () => {
        return h('div', null, [ '我是Comp1' ])
      }
    }
  }

  const Comp2 = {
    setup() {
      onMounted(() => {
        console.log('Comp2 mounted')
      })
      onUnmounted(() => {
        console.log('Comp2 unmounted')
      })
      return () => {
        return h('div', [ '我是Comp2' ])
      }
    }
  }

  const Comp3 = {
    setup() {
      onMounted(() => {
        console.log('Comp3 mounted')
      })
      onUnmounted(() => {
        console.log('Comp3 unmounted')
      })
      return () => {
        return h('div', [ '我是Comp3' ])
      }
    }
  }
  const components = [Comp1, Comp2, Comp3]

  const App = {
    setup() {
      const index = ref(0)
      return () => h('div', [
        h('button', {
          onClick() {
            index.value++
            if (index.value > components.length - 1) {
              index.value = 0
            }
          }
        }, '切换'),
        h(KeepAlive, { max: 2 }, () => h(components[index.value]))
      ])
    }
  }

  const app = createApp(App)
  app.mount('#app')
</script>
</body>
</html>
