<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { h, createApp, getCurrentInstance } from '../dist/index.js'

  const Child = {
    setup() {
      const vm = getCurrentInstance()
      console.log(vm.parent)

      return () => {
        return h('div', '我是子组件')
      }
    }
  }

  const App = {
    name: 'App',
    setup() {
      return () => {
        return h('div', [ h('p', '我是父组件p标签'), h(Child) ])
      }
    }
  }

  const app = createApp(App)
  app.mount('#app')
</script>
</body>
</html>
