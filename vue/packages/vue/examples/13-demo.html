<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { h, createApp, ref } from '../dist/index.js'

  const Child = {
    props: [ 'count' ],
    setup(props, { emit }) {
      return () => {
        return h('button', {
              onClick() {
                emit('foo', 1, 2, 3)
              }
            },
            '我是子组件按钮'
        )
      }
    }
  }

  const Comp = {
    setup() {
      const count = ref(0)

      return () => {
        return h('div', {},
            [
              h('p', '我是父组件p标签'),
              h(Child, {
                count: count.value,
                onFoo: (a, b, c) => {
                  console.log(a, b, c)
                  console.log('父组件传递的事件')
                }
              })
            ]
        )
      }
    }
  }

  createApp(Comp).mount('#app')
</script>
</body>
</html>
